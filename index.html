<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAVE ROAM MINI</title>
<link rel="stylesheet" href="wave-roam.css">
</head>
<body>
<div class="machine">
  <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
  <button id="fullscreenBtn" class="fullscreen" aria-label="Fullscreen"></button>
  <div class="layout">
    <div class="header">
      <div class="logoBox"><img src="https://github.com/user-attachments/assets/d6e95744-d539-4d27-a869-ff2a179b5f7b" alt="WAVE ROAM MINI"></div>
      <button id="playBtn" class="ctrl play" aria-label="Play"></button>
      <button id="nextBtn" class="ctrl next" aria-label="Next station"></button>
      <button id="stopBtn" class="ctrl stopbtn" aria-label="Stop journey"></button>
      <button id="printBtn" class="ctrl printbtn" aria-label="Print journey"><span>PRINT</span></button>
      <div class="screen"><small>NEXT RADIO</small><strong id="nextRadioName">RADIO FRO</strong><span id="nextRadioPlace">LINZ, AUSTRIA</span></div>
      <div class="liveBox"><div id="liveLed" class="led"></div><div id="liveText" class="liveText">READY</div></div>
      <div class="timeBox"><small>TRAVEL TIME</small><strong id="travelClock">00:00:00</strong></div>
    </div>
    <div class="lower">
      <div class="frame"><div class="postcard"><img id="placeImage" alt=""><div class="city" id="postTitle">Linz</div><div class="postmeta"><div class="station" id="postStation">RADIO FRO</div><div class="place" id="postCity">LINZ, AUSTRIA</div></div></div></div>
      <div class="frame side">
        <div class="map"><svg viewBox="0 0 620 310" preserveAspectRatio="xMidYMid meet"><image href="https://upload.wikimedia.org/wikipedia/commons/9/9f/BlankMap-World-Equirectangular.svg" x="0" y="0" width="620" height="310" preserveAspectRatio="none" opacity="0.23"/><path class="route" id="routePath" d="M310 145"/><g id="nodes"></g><circle class="current" id="currentDot" cx="344" cy="82" r="5"/><text class="mapLabel" id="mapLabel" x="354" y="74">LINZ</text></svg></div>
        <div class="info"><div class="name" id="stationName">RADIO FRO</div><div class="loc" id="location">LINZ, AUSTRIA</div><div class="tags" id="tags">RADIO ART / FREE RADIO / EM FIELDS / INTERFERENCE / THIRD NATURE</div><a class="streamlink" id="streamLink" target="_blank" rel="noopener">STREAM · WAITING</a><div class="nextline"><small>NEXT DESTINATION</small><div id="nextSignal">SCANNING AFTER PLAY</div></div></div>
      </div>
    </div>
  </div>
</div>
<audio id="audioA" playsinline preload="none"></audio><audio id="audioB" playsinline preload="none"></audio>
<script src="wave-roam-core.js"></script>
<script src="wave-roam-media.js"></script>
<script src="wave-roam-travel.js"></script>
</body>
</html>
