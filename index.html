<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAVE ROAM MINI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{min-height:100vh;display:grid;place-items:center}.machine{width:min(1180px,96vw);background:#11100e;border:1px solid #39342e;border-radius:18px;padding:12px;box-shadow:0 30px 80px #000}
.top{display:grid;grid-template-columns:150px 66px 66px 66px 66px 1fr 80px 120px;gap:8px;height:150px}
.panel,.btn,.screen{border:1px solid #40372d;background:#0b0907;border-radius:10px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.btn{display:grid;place-items:center;font-size:28px;color:#ef3b2f}.btn small{display:block;font-size:8px;color:#726a60}.nextScreen{padding:14px;display:flex;flex-direction:column;justify-content:center}.cap{font-size:8px;letter-spacing:.16em;color:#806d55}.amber{color:#ef9f19}.ledbox,.timebox{padding:14px}.led{width:16px;height:16px;border-radius:50%;background:#42130f;margin:12px auto}.led.live{background:#ef352c;box-shadow:0 0 15px #ef352c}.time{font-size:25px;color:#ee9914;margin-top:18px}
.main{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:8px;height:410px}.post{position:relative;background:#15110d;overflow:hidden;border-radius:10px}.post img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.06)}.post:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.78))}
.posttext{position:absolute;z-index:2;left:18px;bottom:16px}.postcity{font-size:28px}.poststation{font-size:13px;color:#cfc4b3;margin-top:5px}
.info{padding:16px;display:grid;grid-template-rows:1fr auto}.map svg{width:100%;height:250px}.land{fill:#101a13;stroke:#566452;stroke-width:.8}.route{fill:none;stroke:#df9418;stroke-width:2}.node{fill:#d5cfbf}.current{fill:#ef352c}.maplabel{fill:#d5cfbf;font-size:10px}.now{border-top:1px solid #2f2c26;padding-top:12px}.station{font-size:23px}.place{font-size:11px;color:#d79019;margin-top:5px}.tags{font-size:9px;color:#77736a;line-height:1.4;margin-top:8px}.stream{display:block;color:#a79170;font-size:8px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:9px;border-top:1px solid #29251f;padding-top:7px}
@media(max-width:850px){.top{grid-template-columns:100px 50px 50px 50px 50px 1fr;height:100px}.ledbox,.timebox{display:none}.main{grid-template-columns:1fr;height:auto}.post{height:340px}.info{min-height:360px}}
</style>
</head>
<body>
<div class="machine">
  <div class="top">
    <div class="panel logo"><img src="https://github.com/user-attachments/assets/d6e95744-d539-4d27-a869-ff2a179b5f7b" alt="WAVE ROAM MINI"></div>
    <button class="btn" id="play">▶<small>PLAY</small></button>
    <button class="btn amber" id="next">▶▶<small>NEXT</small></button>
    <button class="btn" id="stop">■<small>STOP</small></button>
    <button class="btn amber" id="print">▤<small>PRINT</small></button>
    <div class="screen nextScreen"><div class="cap">NEXT RADIO</div><div id="nextName" class="amber" style="font-size:20px;margin-top:12px">WAITING</div><div id="nextPlace" style="font-size:10px;margin-top:6px;color:#7c756b">—</div></div>
    <div class="screen ledbox"><div class="cap">ON AIR</div><div id="led" class="led"></div><div id="state" class="cap">READY</div></div>
    <div class="screen timebox"><div class="cap">TRAVEL TIME</div><div id="time" class="time">00:00:00</div></div>
  </div>
  <div class="main">
    <div class="post"><img id="photo" alt=""><div class="posttext"><div id="postCity" class="postcity">LINZ</div><div id="postStation" class="poststation">RADIO FRO</div></div></div>
    <div class="screen info">
      <div class="map">
        <svg viewBox="0 0 620 300">
          <path class="land" d="M40 82L73 52 129 45 169 63 188 95 163 119 126 130 96 121 66 104Z"/>
          <path class="land" d="M145 134L173 146 184 182 169 231 142 252 123 228 130 194 116 158Z"/>
          <path class="land" d="M270 58L323 41 372 50 413 69 462 74 515 96 558 117 542 143 493 149 463 168 423 163 389 143 348 146 313 130 285 104Z"/>
          <path class="land" d="M315 142L352 135 384 154 397 186 382 226 348 253 318 241 299 207 304 171Z"/>
          <path class="land" d="M486 194L518 183 550 197 561 220 541 236 506 234 487 217Z"/>
          <path id="route" class="route" d=""/>
          <g id="nodes"></g><circle id="dot" class="current" r="6"/><text id="mapLabel" class="maplabel">LINZ</text>
        </svg>
      </div>
      <div class="now">
        <div class="cap">NOW PLAYING</div>
        <div id="station" class="station">RADIO FRO</div>
        <div id="place" class="place">LINZ, AUSTRIA</div>
        <div id="tags" class="tags">FREE RADIO · COMMUNITY · CULTURE</div>
        <a id="stream" class="stream" target="_blank">STREAM · WAITING</a>
      </div>
    </div>
  </div>
</div>
<audio id="a" playsinline></audio><audio id="b" playsinline></audio>
<script>
const H=["https://de1.api.radio-browser.info","https://nl1.api.radio-browser.info","https://at1.api.radio-browser.info","https://fi1.api.radio-browser.info"];
const T=["experimental","sound art","radio art","community radio","free radio","independent","freeform","electroacoustic","field recording","ambient","noise","drone","avant-garde","underground","culture","shortwave","electronic","sound collage","industrial","world music"];
const PP={name:"PICK POCKET RADIO",city:"BERLIN",country:"GERMANY",tags:"INDEPENDENT · CULTURE · RADIO",url:"https://radio.pickpocketradio.org/stream.mp3",id:"PICK_POCKET_RADIO",lat:52.52,lon:13.405};
const $=x=>document.getElementById(x),A=$("a"),B=$("b");let on=A,off=B,nxt=null,started=false,paused=false,start=0,pauseAt=0,pausedMs=0,count=0,pp=false,timer=null,history=[],log=[],photoToken=0;
let mem=JSON.parse(localStorage.getItem("wrm100")||"[]");
function state(t,live=false){$("state").textContent=t;$("led").classList.toggle("live",live)}
function fmt(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,"0")).join(":")}
setInterval(()=>{if(started)$("time").textContent=fmt((paused?pauseAt:Date.now())-start-pausedMs)},1000);
function remember(id){if(!id)return;mem=mem.filter(x=>x!==id);mem.push(id);mem=mem.slice(-100);localStorage.setItem("wrm100",JSON.stringify(mem))}
function xy(lat,lon){return [((Number(lon)+180)/360)*620,((90-Number(lat))/180)*300]}
function draw(){let g=history.filter(s=>Number.isFinite(+s.lat)&&Number.isFinite(+s.lon));if(!g.length)return;let p=g.map(s=>xy(s.lat,s.lon)),d=`M${p[0][0]} ${p[0][1]}`;for(let i=1;i<p.length;i++){let[x,y]=p[i],[a,b]=p[i-1];d+=` Q${(a+x)/2} ${Math.min(b,y)-16} ${x} ${y}`}$("route").setAttribute("d",d);$("nodes").innerHTML=p.slice(0,-1).map(([x,y])=>`<circle class="node" cx="${x}" cy="${y}" r="3"/>`).join("");let[x,y]=p.at(-1);$("dot").setAttribute("cx",x);$("dot").setAttribute("cy",y);$("mapLabel").setAttribute("x",Math.min(550,x+10));$("mapLabel").setAttribute("y",Math.max(15,y-8));$("mapLabel").textContent=(g.at(-1).city||g.at(-1).country||"SIGNAL").toUpperCase()}
async function postcard(s){let token=++photoToken,place=s.city||s.country||"world";$("photo").removeAttribute("src");let q=encodeURIComponent(place+" street life city panorama");try{let r=await fetch("https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+q+"&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|size&iiurlwidth=1400&format=json&origin=*",{cache:"no-store"}),j=await r.json();if(token!==photoToken)return;let a=Object.values(j.query?.pages||{}).flatMap(p=>{let i=p.imageinfo?.[0];if(!i?.thumburl)return[];let ratio=i.height?i.width/i.height:0;if(ratio<1.25)return[];let title=(p.title||"").toLowerCase(),score=(ratio>1.45&&ratio<2.5?6:2)+(i.width>1400?2:0)+(/street|square|market|city|panorama|people/.test(title)?3:0)-(/logo|map|flag|portrait|statue/.test(title)?8:0);return[{url:i.thumburl,title:p.title,score}]});a.sort((x,y)=>y.score-x.score);if(a[0]){$("photo").src=a[0].url;s.image=a[0].url;let e=log.at(-1);if(e)e.image=a[0].url}}catch(e){}}
function show(s){let now=Date.now();if(log.length&&!log.at(-1).end){log.at(-1).end=now;log.at(-1).ms=now-log.at(-1).start}log.push({...s,start:now,end:null,ms:0});history.push({...s});if(history.length>18)history.shift();$("station").textContent=(s.name||"UNKNOWN").toUpperCase();$("place").textContent=([s.city,s.country].filter(Boolean).join(", ")||"WORLD").toUpperCase();$("tags").textContent=(s.tags||"LIVE RADIO").toUpperCase();$("postCity").textContent=(s.city||s.country||"WORLD").toUpperCase();$("postStation").textContent=(s.name||"UNKNOWN").toUpperCase();$("stream").href=s.url;$("stream").textContent="STREAM · "+s.url;draw();postcard(s)}
async function api(path){for(const h of H){try{let r=await fetch(h+path,{cache:"no-store"});if(r.ok)return await r.json()}catch(e){}}return[]}
async function fro(){let a=await api("/json/stations/search?name=Radio%20FRO&country=Austria&hidebroken=true&limit=20");let s=a.find(x=>(x.url_resolved||x.url||"").startsWith("https://")&&x.lastcheckok===1);return s&&{name:s.name||"RADIO FRO",city:"LINZ",country:"AUSTRIA",tags:(s.tags||"FREE RADIO,COMMUNITY,CULTURE").split(",").slice(0,4).join(" · "),url:s.url_resolved||s.url,id:s.stationuuid,lat:48.3069,lon:14.2858}}
function ready(el,url){return new Promise(ok=>{let done=false,end=v=>{if(done)return;done=true;ok(v)},yes=()=>end(true),no=()=>end(false);el.oncanplay=yes;el.onloadedmetadata=yes;el.onerror=no;el.src=url;el.muted=true;el.load();setTimeout(()=>end(false),10000)})}
async function find(){let tag=T[Math.floor(Math.random()*T.length)],a=await api("/json/stations/search?tag="+encodeURIComponent(tag)+"&hidebroken=true&order=random&limit=45");for(const s of a.sort(()=>Math.random()-.5)){let u=s.url_resolved||s.url||"",id=s.stationuuid||u;if(!u.startsWith("https://")||!s.lastcheckok||mem.includes(id)||!s.geo_lat||!s.geo_long)continue;if(/top 40|hits|chart|commercial|mainstream/i.test((s.name||"")+" "+(s.tags||"")))continue;return{name:s.name||"UNKNOWN RADIO",city:s.state||"",country:s.country||"",tags:(s.tags||"EXPERIMENTAL").split(",").slice(0,5).join(" · "),url:u,id,lat:+s.geo_lat,lon:+s.geo_long}}}
async function prep(){nxt=null;$("nextName").textContent="SCANNING";$("nextPlace").textContent="NEW SIGNAL";let s=(count>=4&&!pp)?{...PP}:await find();if(!s)return setTimeout(prep,3500);if(await ready(off,s.url)){nxt=s;off._s=s;$("nextName").textContent=s.name.toUpperCase();$("nextPlace").textContent=([s.city,s.country].filter(Boolean).join(", ")||"READY").toUpperCase()}else setTimeout(prep,2500)}
function schedule(){clearTimeout(timer);if(!started||paused)return;let ms=Math.random()<.1?180000+Math.random()*60000:300000+Math.random()*180000;timer=setTimeout(go,ms)}
async function play(){if(started){if(!paused){on.pause();paused=true;pauseAt=Date.now();clearTimeout(timer);state("PAUSE")}else{try{await on.play();paused=false;pausedMs+=Date.now()-pauseAt;state("LIVE",true);schedule()}catch(e){state("TAP AGAIN")}}return}state("CONNECTING");let s=await fro();if(!s)return state("NO LINZ");on.src=s.url;on.muted=false;try{await on.play()}catch(e){return state("TAP AGAIN")}show(s);remember(s.id);started=true;start=Date.now();state("LIVE",true);prep();schedule()}
async function go(){if(!started||paused)return;if(!nxt){await prep();if(!nxt)return}let s=off._s||nxt;state("LOAD");try{off.muted=false;await off.play();on.pause();[on,off]=[off,on];show(s);remember(s.id);if(s.id==="PICK_POCKET_RADIO")pp=true;else count++;nxt=null;state("LIVE",true);prep();schedule()}catch(e){state("SIGNAL LOST");nxt=null;prep();schedule()}}
function stop(){clearTimeout(timer);A.pause();B.pause();started=false;paused=false;if(log.length&&!log.at(-1).end){log.at(-1).end=Date.now();log.at(-1).ms=log.at(-1).end-log.at(-1).start}state("STOPPED")}
function report(){let list=log.map(e=>({...e,ms:e.end?e.ms:Date.now()-e.start}));let items=list.map((e,i)=>`<article><h2>${String(i+1).padStart(2,"0")} · ${e.name}</h2><p>${[e.city,e.country].filter(Boolean).join(", ")} · ${fmt(e.ms)}</p>${e.image?`<img src="${e.image}">`:""}<p>${e.tags||""}</p><a href="${e.url}">${e.url}</a></article>`).join("");let route=list.map(e=>e.city||e.country).join(" → ");return `<!doctype html><meta charset="utf-8"><title>WAVE ROAM JOURNEY</title><style>body{font:14px monospace;max-width:900px;margin:40px auto}img{width:100%;max-height:360px;object-fit:cover}article{border-top:1px solid #aaa;padding:20px 0}a{word-break:break-all}</style><h1>WAVE ROAM MINI — JOURNEY LOG</h1><p>${route}</p>${items}`}
function printReport(){if(!log.length)return;let f=document.createElement("iframe");f.style="position:fixed;width:1px;height:1px;opacity:0";document.body.appendChild(f);let d=f.contentDocument;d.open();d.write(report());d.close();setTimeout(()=>{f.contentWindow.print()},900)}
$("play").onclick=play;$("next").onclick=go;$("stop").onclick=stop;$("print").onclick=printReport;
</script>
</body>
</html>
