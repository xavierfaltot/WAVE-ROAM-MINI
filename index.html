<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WAVE ROAM MINI</title><style>html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}body{display:grid;place-items:center}.app{width:100vw;height:100dvh;background:#0b0b0a;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;grid-template-rows:auto 1fr auto;padding:10px;box-sizing:border-box}.logo{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:260px;margin:0 auto 10px}.k{aspect-ratio:1;border-radius:5px;display:grid;place-items:center;font-weight:900;font-size:clamp(24px,7vw,48px);color:#070707;border:2px solid #111;box-shadow:inset 0 -5px rgba(0,0,0,.22),0 0 0 1px #555}.w{background:#f2e7cb}.r{background:#e59b14}.m{background:#d92720}.screen{display:grid;grid-template-columns:1.7fr 1fr;gap:8px;min-height:0;background:#111;padding:8px;border:1px solid #444;border-radius:10px}.post{position:relative;background:#222;overflow:hidden;border:5px solid #c7b79a}.post img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.8) contrast(1.02) sepia(.12)}.post:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.75))}.city{position:absolute;left:14px;top:10px;z-index:2;color:#c53a30;font:italic 700 clamp(24px,4vw,46px) Georgia,serif}.meta{position:absolute;left:14px;bottom:12px;z-index:2}.station{font-weight:700;font-size:clamp(12px,1.8vw,18px)}.place{font-size:11px;opacity:.75;margin-top:2px}.side{background:#07100b;display:grid;grid-template-rows:58% 42%;min-height:0}.map{border-bottom:1px solid #334034}.map svg{width:100%;height:100%}.land{fill:#102018;stroke:#54735b;stroke-width:.8}.route{fill:none;stroke:#d9ffb0;stroke-width:1.6}.node{fill:#d9ffb0}.current{fill:#ff3a30}.label{fill:#d9ffb0;font:12px monospace}.info{padding:10px;display:flex;flex-direction:column;min-height:0}.name{font-weight:700;font-size:clamp(12px,1.6vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loc{font-size:11px;opacity:.7;margin-top:3px}.tags{font-size:9px;opacity:.55;margin-top:7px;line-height:1.35}.status{margin-top:auto;border-top:1px solid #283329;padding-top:8px;display:grid;grid-template-columns:1fr auto;gap:8px}.small{font-size:8px;opacity:.6;letter-spacing:.08em}.clock{font-weight:700;font-size:20px}.bottom{display:grid;place-items:center;padding-top:10px}.play{width:150px;height:90px;background:#121212;border:2px solid #050505;border-radius:12px;box-shadow:inset 0 0 0 2px #4b463e,inset 0 0 20px #000;position:relative}.play:before{content:"";position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);border-top:20px solid transparent;border-bottom:20px solid transparent;border-left:32px solid #d82c22}.play.running:before{width:24px;height:34px;border:0;background:linear-gradient(90deg,#d82c22 0 38%,transparent 38% 62%,#d82c22 62%);transform:translate(-50%,-50%)}.state{position:absolute;right:14px;bottom:10px;font-size:8px;opacity:.5}@media(max-width:700px){.screen{grid-template-columns:1fr;grid-template-rows:60% 40%}.side{grid-template-columns:43% 57%;grid-template-rows:1fr}.map{border-bottom:0;border-right:1px solid #334034}}</style></head><body><div class="app"><div class="logo"><div class="k w">W</div><div class="k w">A</div><div class="k w">V</div><div class="k w">E</div><div class="k r">R</div><div class="k r">O</div><div class="k r">A</div><div class="k r">M</div><div class="k m">M</div><div class="k m">I</div><div class="k m">N</div><div class="k m">I</div></div><div class="screen"><div class="post"><img id="photo" alt=""><div class="city" id="city">WORLD</div><div class="meta"><div class="station" id="station">READY</div><div class="place" id="place">PRESS PLAY</div></div></div><div class="side"><div class="map"><svg viewBox="0 0 620 340"><path class="land" d="M40 91 L73 57 129 48 169 68 188 103 163 129 126 140 96 130 66 112Z"/><path class="land" d="M145 145 L173 158 184 198 169 248 142 273 123 246 130 209 116 171Z"/><path class="land" d="M270 64 L323 45 372 55 413 75 462 80 515 104 558 127 542 154 493 160 463 181 423 176 389 155 348 158 313 141 285 113Z"/><path class="land" d="M315 153 L352 146 384 166 397 201 382 244 348 274 318 260 299 224 304 185Z"/><path class="land" d="M486 209 L518 197 550 212 561 237 541 255 506 253 487 234Z"/><path class="route" id="route" d="M310 145"/><g id="nodes"></g><circle class="current" id="dot" cx="310" cy="145" r="5"/><text class="label" id="label" x="322" y="139">READY</text></svg></div><div class="info"><div class="name" id="name">READY</div><div class="loc" id="loc">WORLD</div><div class="tags" id="tags">2H30 RADIO TRAVEL</div><div class="status"><div><div class="small">NEXT SIGNAL</div><div id="next">WAITING</div></div><div><div class="small">TIME LEFT</div><div class="clock" id="clock">2:30:00</div></div></div></div></div></div><div class="bottom"><button class="play" id="play" aria-label="play"></button></div><div class="state" id="state">AUDIO READY</div></div><audio id="a" playsinline preload="none"></audio><audio id="b" playsinline preload="none"></audio><script>const TOTAL=150*60*1000;const FALLBACKS=[{name:'PICK POCKET RADIO',city:'BERLIN',country:'GERMANY',tags:'INDEPENDENT / CULTURE / RADIO',lat:52.52,lon:13.405,url:'https://radio.pickpocketradio.org/stream.mp3'},{name:'CASHMERE RADIO',city:'BERLIN',country:'GERMANY',tags:'EXPERIMENTAL / RADIO ART / COMMUNITY',lat:52.52,lon:13.405,url:'https://cashmereradio.out.airtime.pro/cashmereradio_b'}];const HOSTS=['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];const TAGS=['experimental','sound art','ambient','freeform','community','electroacoustic','noise','drone','field recording','culture'];const A=document.getElementById('a'),B=document.getElementById('b'),play=document.getElementById('play');let active=A,standby=B,started=false,startedAt=0,nextStation=null,history=[],recent=new Set(),timer,clockTimer;const $=id=>document.getElementById(id);function setState(t){$('state').textContent=t}function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function tick(){const left=TOTAL-(Date.now()-startedAt);$('clock').textContent=fmt(left);if(left<=0)stop()}function xy(lat,lon){return [((+lon+180)/360)*620,((90-(+lat))/180)*340]}function draw(){if(!history.length)return;const pts=history.map(s=>xy(s.lat,s.lon));let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x,y]=pts[i],[px,py]=pts[i-1];d+=` Q${(px+x)/2} ${Math.min(py,y)-18} ${x} ${y}`}$('route').setAttribute('d',d);$('nodes').innerHTML=pts.slice(0,-1).map(([x,y])=>`<circle class="node" cx="${x}" cy="${y}" r="3"/>`).join('');const[x,y]=pts.at(-1);$('dot').setAttribute('cx',x);$('dot').setAttribute('cy',y);$('label').setAttribute('x',Math.min(540,x+10));$('label').setAttribute('y',Math.max(16,y-8))}async function postcard(st){try{const q=encodeURIComponent((st.city||st.country||'world')+' city landmark architecture');const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*');const j=await r.json();const p=Object.values(j.query?.pages||{}).find(p=>p.imageinfo?.[0]?.thumburl);if(p)$('photo').src=p.imageinfo[0].thumburl}catch(e){}}function show(st){$('name').textContent=(st.name||'UNKNOWN SIGNAL').toUpperCase();$('station').textContent=st.name||'UNKNOWN SIGNAL';$('city').textContent=st.city||st.country||'WORLD';$('place').textContent=((st.city||'')+' '+(st.country||'')).trim();$('loc').textContent=((st.city||'')+(st.city&&st.country?', ':'')+(st.country||'')).toUpperCase();$('tags').textContent=(st.tags||'LIVE RADIO').toUpperCase();$('label').textContent=(st.city||'SIGNAL').toUpperCase();history.push(st);if(history.length>12)history.shift();draw();postcard(st)}function delay(){return Math.random()<.14?90000+Math.random()*60000:210000+Math.random()*180000}function ready(el,url,timeout=9000){return new Promise(res=>{let done=false;const end=v=>{if(done)return;done=true;cleanup();res(v)},ok=()=>end(true),bad=()=>end(false),cleanup=()=>{el.removeEventListener('canplay',ok);el.removeEventListener('loadedmetadata',ok);el.removeEventListener('error',bad)};el.addEventListener('canplay',ok,{once:true});el.addEventListener('loadedmetadata',ok,{once:true});el.addEventListener('error',bad,{once:true});try{el.src=url;el.load()}catch(e){end(false);return}setTimeout(()=>end(false),timeout)})}async function candidates(){const tag=TAGS[Math.floor(Math.random()*TAGS.length)],qs=new URLSearchParams({tag,hidebroken:'true',order:'random',limit:'30'});for(const host of [...HOSTS].sort(()=>Math.random()-.5)){try{const r=await fetch(host+'/json/stations/search?'+qs,{cache:'no-store'});if(!r.ok)continue;const list=await r.json();return list.filter(s=>{const u=s.url_resolved||s.url||'';return u.startsWith('https://')&&s.geo_lat&&s.geo_long&&!recent.has(s.stationuuid)&&s.lastcheckok===1})}catch(e){}}return[]}async function prep(){nextStation=null;$('next').textContent='SCANNING';const list=await candidates();for(const s of list.slice(0,8)){const u=s.url_resolved||s.url;if(await ready(standby,u)){nextStation={name:s.name||'UNKNOWN RADIO',city:s.state||s.country||'',country:s.country||s.countrycode||'',tags:(s.tags||'LIVE RADIO').split(',').slice(0,3).join(' / '),lat:+s.geo_lat,lon:+s.geo_long,url:u,uuid:s.stationuuid};$('next').textContent=(nextStation.city||nextStation.country||'READY').toUpperCase();return}}nextStation={...FALLBACKS[1]};standby.src=nextStation.url;$('next').textContent='BERLIN'}function schedule(){clearTimeout(timer);timer=setTimeout(move,delay())}async function move(){if(Date.now()-startedAt>=TOTAL)return stop();if(!nextStation)await prep();try{await standby.play();active.pause();const old=active;active=standby;standby=old;if(nextStation.uuid)recent.add(nextStation.uuid);show(nextStation);setState('LIVE')}catch(e){setState('SIGNAL LOST')}nextStation=null;prep();schedule()}async function starter(){for(const st of FALLBACKS){active.src=st.url;try{await active.play();show(st);setState('LIVE');return true}catch(e){active.pause()}}return false}async function start(){if(started)return;setState('CONNECTING');const ok=await starter();if(!ok){setState('NO AUDIO — TAP AGAIN');return}started=true;startedAt=Date.now();play.classList.add('running');clockTimer=setInterval(tick,1000);tick();prep();schedule()}function stop(){clearTimeout(timer);clearInterval(clockTimer);A.pause();B.pause();started=false;play.classList.remove('running');$('clock').textContent='0:00:00';$('next').textContent='END';setState('TRIP COMPLETE')}play.onclick=start;</script></body></html>
